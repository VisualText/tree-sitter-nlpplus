name: Publish release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  # A GitHub release with a WASM build of each grammar and the full source.
  release:
    uses: tree-sitter/workflows/.github/workflows/release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
